<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Dashboard | Summarix AI</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}

body{
    background: linear-gradient(135deg,#e8daf0,#e8daf0,#e8daf0);
}

/* LAYOUT */
.wrapper{display:flex;}

/* SIDEBAR */
.sidebar{
    width:240px;
    height:100vh;
    background:rgba(20,15,30,0.95);
    color:#fff;
    padding:20px;
    position:fixed;
}

.sidebar h2{
    margin-bottom:30px;
    display:flex;
    align-items:center;
    gap:10px;
}

.sidebar a{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px;
    color:#ddd;
    text-decoration:none;
    border-radius:10px;
    margin-bottom:10px;
    transition:0.3s;
}

.sidebar a.active{
    background:linear-gradient(45deg,#ff6ec4,#7873f5);
    color:#fff;
}

.sidebar a:hover{
    background:rgba(255,255,255,0.1);
}

/* MAIN */
.main{
    margin-left:240px;
    width:100%;
}

/* NAVBAR */
.navbar{
    margin:20px;
    padding:15px 25px;
    background:rgba(20,15,30,0.85);
    border-radius:20px;
    color:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    backdrop-filter:blur(10px);
}

/* CONTENT */
.container{
    padding:20px;
}

/* 🔥 FORM BOX WITH DASHED BORDER */
.form-box{
    background:rgba(255,255,255,0.25);
    backdrop-filter:blur(10px);
    padding:30px;
    border-radius:20px;
    border:2px dashed rgba(120,115,245,0.6);
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
    transition:0.3s;
}

.form-box:hover{
    border-color:#ff6ec4;
    box-shadow:0 15px 35px rgba(0,0,0,0.2);
}

/* INPUT */
.form-box label{
    font-weight:600;
    display:block;
    margin-bottom:5px;
}

.form-box input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid rgba(0,0,0,0.1);
    margin-bottom:15px;
    transition:0.3s;
}

.form-box input:focus{
    border-color:#7873f5;
    outline:none;
    box-shadow:0 0 0 2px rgba(120,115,245,0.2);
}

/* FILE INPUT SPECIAL */
input[type="file"]{
    border:2px dashed rgba(0,0,0,0.2);
    background:#fff;
    cursor:pointer;
}

/* BUTTON */
.btn{
    width:100%;
    padding:14px;
    background:linear-gradient(45deg,#ff6ec4,#7873f5);
    color:#fff;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.02);
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

/* 🔥 RESULT BOX UPGRADE */
.result-box{
    margin-top:30px;
    background:rgba(255,255,255,0.35);
    backdrop-filter:blur(12px);
    padding:30px;
    border-radius:20px;
    line-height:1.8;
    border-left:6px solid #7873f5;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
    animation:fadeIn 0.5s ease;
}

/* RESULT TITLE */
.result-box h4{
    margin-bottom:15px;
    display:flex;
    align-items:center;
    gap:10px;
}

/* TEXT STYLE */
.result-text{
    white-space: pre-line;
    color:#333;
}

/* ANIMATION */
@keyframes fadeIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
}

/* RESPONSIVE */
@media(max-width:900px){
    .sidebar{display:none;}
    .main{margin-left:0;}
}
</style>
</head>

<body>

<div class="wrapper">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2><i class="fa fa-brain"></i> Summarix AI</h2>

        <a href="/dashboard" class="active">
            <i class="fa fa-home"></i> Dashboard
        </a>

        <a href="#">
            <i class="fa fa-globe"></i> Analyze
        </a>

        <a href="#">
            <i class="fa fa-history"></i> History
        </a>

        <a href="/logout">
            <i class="fa fa-sign-out-alt"></i> Logout
        </a>
    </div>

    <!-- MAIN -->
    <div class="main">

        <!-- NAVBAR -->
        <div class="navbar">
            <h3>User Dashboard</h3>
            <span>Welcome, {{ session['user'] }}</span>
        </div>

        <!-- CONTENT -->
        <div class="container">

            <!-- 🔥 FORM -->
            <div class="form-box">

                <h3 style="margin-bottom:20px;">
                    <i class="fa fa-magic"></i> Analyze Content
                </h3>

                <form method="POST" enctype="multipart/form-data">

                    <label>🌐 Website / Video URL</label>
                    <input name="url" placeholder="Paste URL (YouTube, Website, etc.)">

                    <label>📁 Upload File</label>
                    <input type="file" name="file">

                    <button class="btn">
                        🚀 Analyze & Summarize
                    </button>

                </form>

            </div>

            <!-- 🔥 RESULT -->
            {% if result %}
            <div class="result-box">

                <h4>
                    <i class="fa fa-brain"></i> AI Generated Summary
                </h4>

                <div class="result-text">
                    {{ result }}
                </div>

            </div>
            {% endif %}

        </div>

    </div>

</div>

</body>
</html>
