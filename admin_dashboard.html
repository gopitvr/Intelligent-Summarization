<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Summarix AI</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}

body{
    background: linear-gradient(135deg,#e8daf0,#e8daf0,#e8daf0);
}

/* LAYOUT */
.wrapper{
    display:flex;
}

/* SIDEBAR */
.sidebar{
    width:240px;
    height:100vh;
    background:rgba(20,15,30,0.95);
    color:#fff;
    padding:20px;
    position:fixed;
}

.sidebar h2{
    margin-bottom:30px;
    display:flex;
    align-items:center;
    gap:10px;
}

.sidebar a{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px;
    color:#ddd;
    text-decoration:none;
    border-radius:10px;
    margin-bottom:10px;
    transition:0.3s;
}

.sidebar a.active{
    background:linear-gradient(45deg,#ff6ec4,#7873f5);
    color:#fff;
}

.sidebar a:hover{
    background:rgba(255,255,255,0.1);
}

/* MAIN */
.main{
    margin-left:240px;
    width:100%;
}

/* NAVBAR */
.navbar{
    margin:20px;
    padding:15px 25px;
    background:rgba(20,15,30,0.85);
    border-radius:20px;
    color:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    backdrop-filter:blur(10px);
}

/* CONTENT */
.container{
    padding:20px;
}

/* CARDS */
.cards{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.card{
    flex:1;
    min-width:200px;
    padding:25px;
    border-radius:15px;
    color:#fff;
    background:linear-gradient(45deg,#ff6ec4,#7873f5);
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card h2{
    font-size:30px;
}

/* TABLE */
.table-container{
    margin-top:30px;
    background:rgba(255,255,255,0.25);
    backdrop-filter:blur(10px);
    padding:20px;
    border-radius:15px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th, td{
    padding:12px;
    text-align:left;
}

th{
    background:rgba(20,15,30,0.9);
    color:#fff;
}

tr{
    border-bottom:1px solid rgba(0,0,0,0.1);
}

tr:hover{
    background:rgba(255,255,255,0.2);
}

/* RESPONSIVE */
@media(max-width:900px){
    .sidebar{display:none;}
    .main{margin-left:0;}
}
</style>
</head>

<body>

<div class="wrapper">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2><i class="fa fa-brain"></i> Summarix AI</h2>

        <a href="/admin/dashboard" class="active">
            <i class="fa fa-chart-line"></i> Dashboard
        </a>

        <a href="#">
            <i class="fa fa-users"></i> Users
        </a>

        <a href="#">
            <i class="fa fa-cogs"></i> Settings
        </a>

        <a href="/admin/logout">
            <i class="fa fa-sign-out-alt"></i> Logout
        </a>
    </div>

    <!-- MAIN -->
    <div class="main">

        <!-- NAVBAR -->
        <div class="navbar">
            <h3>Admin Dashboard</h3>
            <span>Welcome, Admin</span>
        </div>

        <!-- CONTENT -->
        <div class="container">

            <!-- CARDS -->
            <div class="cards">

                <div class="card">
                    <h2>{{ total_users }}</h2>
                    <p>Total Users</p>
                </div>

                <div class="card">
                    <h2>Active</h2>
                    <p>System Status</p>
                </div>

            </div>

            <!-- TABLE -->
            <div class="table-container">
                <h2>Registered Users</h2>

                <table>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Mobile</th>
                        <th>Username</th>
                    </tr>

                    {% for user in users %}
                    <tr>
                        <td>{{ user[0] }}</td>
                        <td>{{ user[1] }}</td>
                        <td>{{ user[2] }}</td>
                        <td>{{ user[3] }}</td>
                        <td>{{ user[4] }}</td>
                    </tr>
                    {% endfor %}
                </table>
            </div>

        </div>

    </div>

</div>

</body>
</html>
